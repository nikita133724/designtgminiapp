name: Production static build

on:
  push:
    branches:
      - integrate-fastapi-static
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /app
        run: npm run build

      - name: Upload FastAPI-ready frontend
        uses: actions/upload-artifact@v4
        with:
          name: zooma-static-frontend
          path: out/
          if-no-files-found: error
          retention-days: 14
