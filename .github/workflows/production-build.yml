name: Production static build

on:
  push:
    branches:
      - integrate-fastapi-static
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove demo layer
        run: npm run prepare:production

      - name: Persist migrated source and lockfile
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply production API migration [skip ci]"
            git push
          fi

      - name: Type check
        run: npm run typecheck

      - name: Build static frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /app
        run: npm run build

      - name: Upload FastAPI-ready frontend
        uses: actions/upload-artifact@v4
        with:
          name: zooma-static-frontend
          path: out/
          if-no-files-found: error
          retention-days: 14
