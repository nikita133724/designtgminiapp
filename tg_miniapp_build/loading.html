<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ZOOMA</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050914;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-spin-custom {
      animation: spin 1s linear infinite;
    }

    @keyframes pulse-custom {
      0%, 100% { opacity: 0.2; transform: scale(0.95); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }

    .animate-pulse-custom {
      animation: pulse-custom 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-[#050914] flex flex-col items-center justify-center p-6 text-slate-400 select-none">

  <div class="text-center space-y-6">
    <div class="relative flex items-center justify-center mx-auto">
      <!-- Glow behind the spinner -->
      <div class="absolute w-20 h-20 rounded-full bg-emerald-500/10 blur-2xl animate-pulse-custom"></div>
      
      <!-- Exact React SVG Spinner -->
      <svg class="w-16 h-16 animate-spin-custom" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="spinner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
        </defs>
        <circle
          cx="50"
          cy="50"
          r="42"
          stroke="#1e293b"
          stroke-width="3.5"
          fill="none"
          class="opacity-20"
        />
        <circle
          cx="50"
          cy="50"
          r="42"
          stroke="url(#spinner-grad)"
          stroke-width="3.5"
          stroke-dasharray="160 260"
          stroke-linecap="round"
          fill="none"
        />
      </svg>
    </div>

    <div class="space-y-1">
      <h3 class="text-md font-bold text-slate-200 tracking-wide">ZOOMA</h3>
      <p id="loadingText" class="text-xs text-slate-400 font-medium tracking-wide h-4 transition-all duration-300">
        Подключение к серверу...
      </p>
    </div>
  </div>

  <script>
    // Init Telegram WebApp if present
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (_) {}

    // Exact steps sequence matching React version
    const loadingSteps = [
      "Подключение к серверу...",
      "Инициализация профиля...",
      "Синхронизация модулей...",
      "Запуск интерфейса..."
    ];

    let currentStep = 0;
    const loadingTextEl = document.getElementById("loadingText");

    const interval = setInterval(() => {
      currentStep++;
      if (currentStep < loadingSteps.length) {
        if (loadingTextEl) {
          loadingTextEl.textContent = loadingSteps[currentStep];
        }
      } else {
        clearInterval(interval);
      }
    }, 350);
  </script>

</body>
</html>
