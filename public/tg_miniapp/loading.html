<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ZOOMA Client — Загрузка...</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            zooma: {
              bg: '#070c18',
              card: '#0f172a',
              accent: '#38bdf8',
              accentHover: '#0284c7',
              success: '#22c55e',
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg: #070c18;
      --card: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #070c18 !important;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 500px at 50% -100px, #1e293b 0%, #0f172a 45%, #070c18 100%) !important;
    }

    .loader-container {
      width: min(90vw, 380px);
      padding: 32px 24px;
      text-align: center;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.65) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Glow Orb behind loader */
    .glow-orb {
      position: absolute;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(2, 132, 199, 0) 70%);
      border-radius: 50%;
      top: 30px;
      z-index: 0;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 0.9; }
    }

    /* Spinner Design */
    .spinner-ring {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
      z-index: 1;
    }

    .spinner-circle {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #38bdf8;
      animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }

    .spinner-circle-inner {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: #0284c7;
      animation: spinReverse 1.4s linear infinite;
    }

    .logo-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      font-family: 'JetBrains Mono', monospace;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #f8fafc;
      margin-bottom: 6px;
      z-index: 1;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 20px;
      z-index: 1;
      height: 20px;
      transition: all 0.3s ease;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7 0%, #38bdf8 100%);
      border-radius: 999px;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .status-text {
      margin-top: 12px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
      z-index: 1;
    }
  </style>
</head>
<body>

<div class="loader-container">
  <div class="glow-orb"></div>

  <div class="spinner-ring">
    <div class="spinner-circle"></div>
    <div class="spinner-circle-inner"></div>
    <div class="logo-icon">Z</div>
  </div>

  <div class="title">ZOOMA Client</div>
  <div class="subtitle" id="statusMessage">Инициализация...</div>

  <div class="progress-track">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="status-text" id="statusStep">Telegram WebApp</div>
</div>

<script>
  // Initialize Telegram WebApp
  const tg = window.Telegram?.WebApp || {};
  try {
    if (tg.ready) tg.ready();
    if (tg.expand) tg.expand();
  } catch (_) {}

  // Loading animation sequence simulation
  const steps = [
    { text: "Проверка авторизации...", step: "Telegram Init", progress: 25 },
    { text: "Подключение к серверу...", step: "Handshake WS/API", progress: 55 },
    { text: "Загрузка данных аккаунта...", step: "Syncing State", progress: 85 },
    { text: "Запуск кабинета...", step: "Ready", progress: 100 }
  ];

  let currentStep = 0;
  const statusMsg = document.getElementById("statusMessage");
  const statusStep = document.getElementById("statusStep");
  const progressBar = document.getElementById("progressBar");

  function nextStep() {
    if (currentStep < steps.length) {
      const s = steps[currentStep];
      if (statusMsg) statusMsg.textContent = s.text;
      if (statusStep) statusStep.textContent = s.step;
      if (progressBar) progressBar.style.width = s.progress + "%";
      currentStep++;
      setTimeout(nextStep, 350);
    }
  }

  // Start smooth progress animation
  setTimeout(nextStep, 150);
</script>

</body>
</html>
