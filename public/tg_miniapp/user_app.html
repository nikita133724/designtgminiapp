    .addon-select{width:100%;height:42px;box-sizing:border-box;background:#0f1522;border:1px solid #2a3957;color:#fff;border-radius:10px;padding:0 9px;font-size:13px}
    .addon-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .chat-ai-box{margin-top:10px;scroll-margin-top:84px}.chat-ai-settings{padding-top:10px;border-top:1px solid var(--line);margin-top:10px}.chat-ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chat-ai-grid input,.chat-ai-key{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:0 10px}.chat-ai-recent{font-size:12px;line-height:1.45;margin-top:8px}.chat-ai-save{margin-top:8px}.chat-ai-countdown{font-weight:800}.chat-ai-rain-miss{width:100%;min-height:40px;max-height:120px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:9px 10px;font:inherit;font-size:13px;line-height:1.45;resize:vertical;white-space:pre-wrap;word-break:normal;overflow-wrap:normal;overflow-x:auto}.chat-ai-miss-hint{font-size:11px;line-height:1.35;margin:9px 0 5px}

    .chat-ai-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.chat-ai-head-actions{display:flex;align-items:center;gap:8px}.chat-ai-collapse{width:24px;height:30px;padding:0;border:0;background:transparent;box-shadow:none;color:var(--muted);font-size:18px;line-height:1}.chat-ai-collapse:active{transform:scale(.92)}.chat-ai-substatus{display:inline-block;margin-top:3px;font-size:11px;line-height:1.25}.chat-ai-status{margin-top:8px;font-size:12px;line-height:1.35}.account-promo{margin-top:8px;padding-top:8px;border-top:1px solid rgba(120,165,235,.18)}.btn-reset-account{width:100%;margin-top:7px;background:linear-gradient(180deg,#5b2631 0%,#431c26 100%);border:1px solid rgba(255,120,140,.35)}.reset-actions .btn{width:100%;height:48px;margin-top:0;padding:9px 10px}.reset-actions .btn-cancel{margin-top:0}
    @media (max-width:759px){
      body.chat-ai-keyboard-open .wrap{padding-bottom:var(--chat-ai-keyboard-gap,45vh)}
      body.chat-ai-keyboard-open .chat-ai-box.chat-ai-focus-card{position:relative;z-index:5}
    }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap">
  <div id="view-profile"></div>
  <div id="view-accounts" style="display:none"></div>
  <div id="view-tariffs" style="display:none"></div>
</div>
<div class="tabs">
  <div class="tabs-inner">
    <div class="tab a" data-v="profile">Профиль</div>
    <div class="tab" data-v="accounts">Аккаунты</div>
    <div class="tab" data-v="tariffs">Тарифы</div>
  </div>
</div>
<div class="addon-modal-backdrop" id="addonBuyModal">
  <div class="addon-modal">
    <h3>Доп. аккаунт</h3>
    <div id="addonTariffInfo" class="m"></div>
    <div style="height:8px"></div>
    <select id="addonAccountSelect" class="addon-select"></select>
    <div id="addonBuySummary" class="addon-summary"></div>
    <div class="addon-actions">
      <button class="btn btnp" id="addonConfirmBtn">Купить</button>
      <button class="btn" id="addonCancelBtn">Отмена</button>
    </div>
  </div>
</div>
<div class="addon-modal-backdrop" id="unbindConfirmModal">
  <div class="addon-modal">
    <h3>Вы уверены отвязать расширение?</h3>
    <div class="addon-actions">
      <button class="btn btnp" onclick="confirmUnbindExtension()">Да</button>
      <button class="btn" onclick="closeUnbindConfirm()">Нет</button>
    </div>
  </div>
</div>

<div class="addon-modal-backdrop" id="resetAccountConfirmModal">
  <div class="addon-modal">
    <h3>Очистить данные аккаунта?</h3>
    <div id="resetAccountConfirmText" class="addon-summary"></div>
    <div class="addon-actions reset-actions">
      <button class="btn btn-cancel" onclick="confirmResetAccount()">Очистить</button>
      <button class="btn" onclick="closeResetAccountConfirm()">Отмена</button>
    </div>
  </div>
</div>
<script>
const tg=window.Telegram?.WebApp||{
  initData:"",
  ready(){},
  expand(){},
  close(){},
  openTelegramLink(url){ window.location.href=url; }
};
try{tg.ready();tg.expand()}catch(_){}
const initData=tg.initData||"";
let state=null,ws=null,wsTimer=null,wsReconnectTimer=null,lastInvoice=null,countdownTimer=null,stateRefreshTimer=null,stateRefreshBusy=false,activeTab='profile',wsLastMessageTs=0,pendingUnbindAccountId='',pendingResetAccountId='';
const proxyOpen={};
const proxyDrafts={};
let tariffType=localStorage.getItem('zooma_app_tariff_type_v1')||'main';
let addonConfig={tariffs_addon:[],accounts:[]};
let selectedAddonTariff=null;
let promoStatsFlashUntil=0,promoStatsFlashTimer=null;
const chatAiSetupOpen={};
const chatAiPanelOpen={};
const chatAiDrafts={};
const pendingToggleOps=new Map();
function toggleOpBusy(key){return pendingToggleOps.has(String(key||''))}
function beginToggleOp(key){const k=String(key||'');if(!k||pendingToggleOps.has(k))return false;const timer=setTimeout(()=>{pendingToggleOps.delete(k);refreshState(true).finally(()=>{renderProfile();renderAccounts()})},15000);pendingToggleOps.set(k,timer);return true}
function endToggleOp(key){const k=String(key||'');const timer=pendingToggleOps.get(k);if(timer)clearTimeout(timer);pendingToggleOps.delete(k)}
const $=s=>document.querySelector(s);
let toastTimer=null;
function toast(t,type='info',ms=null){const x=$('#toast');if(!x)return;if(toastTimer)clearTimeout(toastTimer);const cls=(type===true?'err':type||'info');x.textContent=t;x.className='toast '+cls;x.style.display='block';x.onclick=()=>{if(toastTimer)clearTimeout(toastTimer);x.style.display='none'};toastTimer=setTimeout(()=>x.style.display='none',ms??(cls==='err'?5000:2600))}
const store={
  kTab:'zooma_app_tab_v1',
  kInv:'zooma_app_invoice_v1',
  setTab(v){localStorage.setItem(this.kTab,v||'profile')},
  getTab(){return localStorage.getItem(this.kTab)||'profile'},
  setInv(chatId,inv){localStorage.setItem(this.kInv,JSON.stringify({chat_id:Number(chatId||0),invoice:inv||null}))},
  getInv(){try{return JSON.parse(localStorage.getItem(this.kInv)||'null')}catch(_){return null}},
  clearInv(){localStorage.removeItem(this.kInv)}
};
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function promoStatsFlashClass(){return Date.now()<promoStatsFlashUntil?'flash':''}
function jsonEq(a,b){try{return JSON.stringify(a)===JSON.stringify(b)}catch(_){return false}}
function profileSlice(s){const a=activeChatAiAccount(s);return {chat_id:Number(s?.chat_id||0),tg_username:String(s?.tg_username||''),subscription_tier:String(s?.subscription_tier||''),subscription_until_ts:Number(s?.subscription_until_ts||0),proxy_set:!!s?.proxy_set,proxy_ip:String(s?.proxy_ip||''),proxy_scheme:String(s?.proxy_scheme||''),proxy_ping_ms:s?.proxy_ping_ms??null,effective_ping_ms:s?.effective_ping_ms??null,effective_ping_source:String(s?.effective_ping_source||''),main_subscription_active:!!s?.main_subscription_active,promo_activation_paused:!!s?.promo_activation_paused,promo_activation_mode:String(s?.promo_activation_mode||'server'),chat_ai_enabled:!!a?.chat_ai_enabled,chat_ai_has_api_key:!!a?.chat_ai_has_api_key,chat_ai_next_run_ts:Number(a?.chat_ai_next_run_ts||0),chat_ai_interval_min_sec:Number(a?.chat_ai_interval_min_sec||600),chat_ai_interval_max_sec:Number(a?.chat_ai_interval_max_sec||1500),chat_ai_cycle_started_ts:Number(a?.chat_ai_cycle_started_ts||0),chat_ai_rest_until_ts:Number(a?.chat_ai_rest_until_ts||0),chat_ai_rain_miss_messages:Array.isArray(a?.chat_ai_rain_miss_messages)?a.chat_ai_rain_miss_messages:[],chat_ai_recent_messages:a?.chat_ai_recent_messages||[]}}
function accountsSlice(s){return {active_account_id:String(s?.active_account_id||''),accounts:Array.isArray(s?.accounts)?s.accounts:[]}}
function promoSlice(s){return {promo_activated_count:Number(s?.promo_activated_count||0),promo_activated_total_amount:Number(s?.promo_activated_total_amount||0),promo_month_key:String(s?.promo_month_key||''),promo_month_label:String(s?.promo_month_label||''),promo_month_total_amount:Number(s?.promo_month_total_amount||0)}}
function tariffsSlice(s){return {tariffs:Array.isArray(s?.tariffs)?s.tariffs:[]}}
function invoiceSlice(s){return {pending_invoice:s?.pending_invoice??null}}
function addonSlice(s){return {addon_config:s?.addon_config||{tariffs_addon:[],accounts:[]}}}
function syncAddonConfigFromState(){if(state?.addon_config){addonConfig=state.addon_config||{tariffs_addon:[],accounts:[]}}}
function maybeFlashPromo(oldCount,oldTotal,newCount,newTotal){if(newCount>oldCount||newTotal>oldTotal){promoStatsFlashUntil=Date.now()+3000;if(promoStatsFlashTimer)clearTimeout(promoStatsFlashTimer);promoStatsFlashTimer=setTimeout(()=>renderProfile(),3050)}}
function tzPayload(){let timezone='',locale='',offset_min=null;try{timezone=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(_){}try{locale=navigator.language||''}catch(_){}try{offset_min=new Date().getTimezoneOffset()}catch(_){}return {timezone,offset_min,locale}}
function applyLocalTimezoneToState(){if(!state)return;const p=tzPayload();if(p.timezone){state.timezone_name=p.timezone;state.timezone_valid=true;state.timezone_offset_min=p.offset_min;state.locale=p.locale}}
function tzOffsetLabel(ts){const tz=String(state?.timezone_name||'').trim();if(!tz)return '';const d=new Date(Number(ts||Math.floor(Date.now()/1000))*1000);try{const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'longOffset',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);let raw=(parts.find(p=>p.type==='timeZoneName')||{}).value||'';raw=raw.replace('GMT','UTC');const m=raw.match(/^UTC([+-])(\d{1,2})(?::?(\d{2}))?$/);if(m)return `UTC${m[1]}${String(m[2]).padStart(2,'0')}:${String(m[3]||'00').padStart(2,'0')}`;if(raw)return raw}catch(_){}const off=Number(state?.timezone_offset_min);if(Number.isFinite(off)){const mins=-off,sign=mins>=0?'+':'-',abs=Math.abs(mins);return `UTC${sign}${String(Math.floor(abs/60)).padStart(2,'0')}:${String(abs%60).padStart(2,'0')}`}return ''}
function tzLine(ts){if(!state?.timezone_valid||!state?.timezone_name)return '';const off=tzOffsetLabel(ts);return `<div class='row'><span class='m'>Часовой пояс</span><span>${esc(state.timezone_name)}${off?' ('+esc(off)+')':''}</span></div>`}
function fmtTs(ts){const n=Number(ts||0);if(!n)return '-';const d=new Date(n*1000);const base={hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'};try{if(state?.timezone_valid&&state?.timezone_name)return d.toLocaleString('ru-RU',{...base,timeZone:state.timezone_name});return d.toLocaleString('ru-RU',{...base,timeZone:'Europe/Moscow'})+' МСК'}catch(_){return d.toLocaleString('ru-RU',{hour12:false})}}
function pingColor(ms){const v=Number(ms);if(!Number.isFinite(v))return '';if(v<450)return '#16a34a';if(v<900)return '#d97706';return '#ef4444'}
function pingMs(o){const raw=(o?.effective_ping_ms!=null?o.effective_ping_ms:o?.proxy_ping_ms);const v=Number(raw);return Number.isFinite(v)?v:null}
function pingSource(o){return String(o?.effective_ping_source||o?.proxy_ping_source||'').toLowerCase()}
function pingLabel(o){const s=pingSource(o);if(s==='extension')return 'Пинг расширения';if(s==='server')return 'Пинг сервера';return 'Пинг прокси'}
function pingHtml(o){const v=pingMs(o);if(v==null)return '-';return `<span style="color:${pingColor(v)};font-weight:800">${v.toFixed(1)} мс</span>`}

function accountCardHtml(a){const aid=String(a.account_id||'');const frozen=!!a.subscription_paused;const mode=String(a.promo_activation_mode||'server')==='extension'?'extension':'server';const bound=!!a.extension_bound_chat_id;const promoEnabled=!a.promo_activation_paused;const modeBusy=toggleOpBusy(`mode:${aid}`),promoBusy=toggleOpBusy(`promo:${aid}`);const secondaryAction=mode==='extension'?`<button class='btn btn-proxy-toggle' onclick="reloadExtensionPage('${esc(aid)}')">Обновить страницу ПК</button>`:`<button class='btn btn-proxy-toggle' onclick="toggleProxy('${esc(aid)}')">${proxyOpen[aid]?'Скрыть прокси':'Прокси'}</button>${proxyBox(a)}<button class='btn btn-reset-account' onclick="requestResetAccount('${esc(aid)}')">Сбросить данные аккаунта</button>`;return `<div class='card' data-account-card='${esc(aid)}'>${Number(a.slot||1)>1?`<div class='account-title'>Доп. аккаунт ${a.slot}</div>`:''}<div class='row'><span class='m'>Имя</span><span>${esc(a.port_user_name||'-')}</span></div><div class='row'><span class='m'>Авторизация</span><span>${authCombo(a)}</span></div><div class='row'><span><b>Режим активации</b><br><span class='m'>${mode==='extension'?'Расширение':'Сервер'}</span></span><label class='ios-switch'><input type='checkbox' ${mode==='extension'?'checked':''} ${modeBusy?'disabled':''} onchange="setActivationMode('${esc(aid)}',this.checked?'extension':'server',this)"><span class='ios-slider'></span></label></div><div class='row account-promo'><span><b>Активация промо</b></span><label class='ios-switch'><input type='checkbox' ${promoEnabled?'checked':''} ${promoBusy?'disabled':''} onchange="setAccountPromo('${esc(aid)}',this.checked,this)"><span class='ios-slider'></span></label></div>${frozen?`<div class='row'><span class='m'>Подписка</span><span class='badge b-warn sub-frozen'>заморожен</span></div><div class='row'><span class='m'>Остаток</span><span class='sub-frozen'>${frozenLeftText(a.subscription_frozen_left_sec)}</span></div>`:`<div class='row'><span class='m'>Подписка до</span><span>${fmtTs(a.subscription_until_ts)}</span></div>`}<div class='row'><span class='m'>${pingLabel(a)}</span><span>${pingHtml(a)}</span></div>${bound?`<button class='btn btn-cancel' onclick="requestUnbindExtension('${esc(aid)}')">Отвязать расширение</button>`:''}${frozen?`<div class='m tiny'>Аккаунт заморожен. Действия временно недоступны.</div>`:`<button class='btn btnp btn-connect' onclick="connectPrompt('${esc(aid)}')">Подключить / переподключить</button>${secondaryAction}`}</div>`}

async function setAccountPromo(accountId,enabled,input){const aid=String(accountId||'');const op=`promo:${aid}`;if(!beginToggleOp(op)){if(input)input.checked=!enabled;return}const acc=(state?.accounts||[]).find(x=>String(x.account_id||'')===aid);const prev=!!acc?.promo_activation_paused;if(acc)acc.promo_activation_paused=!enabled;renderAccounts();try{const j=await api('/app/api/promo-activation-pause','POST',{account_id:aid,paused:!enabled});if(acc)acc.promo_activation_paused=!!j.data?.promo_activation_paused;toast(enabled?'Активация промо включена':'Активация промо на паузе','ok')}catch(e){if(acc)acc.promo_activation_paused=prev;toast(e.message||'Не удалось сохранить паузу','err')}finally{endToggleOp(op);renderAccounts()}}

async function setActivationMode(accountId,mode,input){const aid=String(accountId||'');const op=`mode:${aid}`;if(!beginToggleOp(op)){if(input)input.checked=String(mode||'server')!=='extension';return}renderAccounts();try{await api('/app/api/promo-activation-mode','POST',{account_id:aid,mode:String(mode||'server')});await refreshState(true);toast(mode==='extension'?'Включена работа через расширение':'Включена работа через сервер','ok')}catch(e){await refreshState(true);toast(e.message||'Не удалось переключить режим','err',5000)}finally{endToggleOp(op);renderAccounts()}}
function requestResetAccount(accountId){pendingResetAccountId=String(accountId||'');const acc=(state?.accounts||[]).find(x=>String(x.account_id||'')===pendingResetAccountId)||{};const modal=document.getElementById('resetAccountConfirmModal'),info=document.getElementById('resetAccountConfirmText');if(info)info.textContent=`Будут очищены данные казино и прокси слота #${Number(acc.slot||1)}. Слот, подписка и настройки Chat AI останутся.`;if(modal)modal.style.display='flex'}

function renderAll(){renderProfile();renderAccounts();renderTariffsView()}
function applyServerState(nextState,flash=true){const oldCount=Number(state?.promo_activated_count||0),oldTotal=Number(state?.promo_activated_total_amount||0);state=nextState||{};applyLocalTimezoneToState();syncAddonConfigFromState();if(flash)maybeFlashPromo(oldCount,oldTotal,Number(state?.promo_activated_count||0),Number(state?.promo_activated_total_amount||0))}
function applySnapshotState(nextState,flash=true){if(!state){applyServerState(nextState,flash);syncInvoiceFromState();if(!lastInvoice)hydrateSavedInvoice();renderAll();refreshAddonModalFromConfig();return}const prev=state;const oldCount=Number(prev?.promo_activated_count||0),oldTotal=Number(prev?.promo_activated_total_amount||0);const profileChanged=!jsonEq(profileSlice(prev),profileSlice(nextState));const accountsChanged=!jsonEq(accountsSlice(prev),accountsSlice(nextState));const promoChanged=!jsonEq(promoSlice(prev),promoSlice(nextState));const tariffsChanged=!jsonEq(tariffsSlice(prev),tariffsSlice(nextState));const invoiceChanged=!jsonEq(invoiceSlice(prev),invoiceSlice(nextState));const addonChanged=!jsonEq(addonSlice(prev),addonSlice(nextState));state=nextState||{};applyLocalTimezoneToState();syncAddonConfigFromState();syncInvoiceFromState();if(flash&&promoChanged)maybeFlashPromo(oldCount,oldTotal,Number(state?.promo_activated_count||0),Number(state?.promo_activated_total_amount||0));if(profileChanged||promoChanged||accountsChanged)renderProfile();if(accountsChanged)renderAccounts();if(tariffsChanged||invoiceChanged||addonChanged)renderTariffsView();if(addonChanged)refreshAddonModalFromConfig()}
function applyProfilePatch(data){state=state||{};Object.assign(state,data||{});applyLocalTimezoneToState();renderProfile()}
function applyAccountsPatch(data){state=state||{};state.active_account_id=String(data?.active_account_id||state.active_account_id||'');state.accounts=Array.isArray(data?.accounts)?data.accounts:[];renderAccounts();renderProfile()}
function applyAccountPatch(data){if(!state||!data)return;const aid=String(data.account_id||'');const list=Array.isArray(state.accounts)?state.accounts:[];const idx=list.findIndex(x=>String(x.account_id||'')===aid);if(idx>=0)list[idx]={...list[idx],...data};else list.push(data);state.accounts=list;const node=document.querySelector(`[data-account-card="${CSS.escape(aid)}"]`);if(node){const wrap=document.createElement('div');wrap.innerHTML=accountCardHtml(list.find(x=>String(x.account_id||'')===aid));node.replaceWith(wrap.firstElementChild)}else renderAccounts();if(String(state.active_account_id||'')===aid&&!document.activeElement?.closest?.('.chat-ai-box input,.chat-ai-box textarea'))renderProfile()}

function applyInvoicePatch(data){state=state||{};state.pending_invoice=data?.pending_invoice??null;syncInvoiceFromState();renderTariffsView()}
function applyPromoPatch(data){state=state||{};const oldCount=Number(state?.promo_activated_count||0),oldTotal=Number(state?.promo_activated_total_amount||0);Object.assign(state,data||{});maybeFlashPromo(oldCount,oldTotal,Number(state?.promo_activated_count||0),Number(state?.promo_activated_total_amount||0));renderProfile()}
function applyTariffsPatch(data){state=state||{};state.tariffs=Array.isArray(data?.tariffs)?data.tariffs:[];renderTariffsView()}
function applyAddonConfigPatch(data){state=state||{};state.addon_config=data?.addon_config||{tariffs_addon:[],accounts:[]};syncAddonConfigFromState();renderTariffsView();refreshAddonModalFromConfig()}
function applyWsPayload(msg){if(!msg||typeof msg!=='object')return;if(msg.type==='bootstrap'||msg.type==='state'){applySnapshotState(msg.data||{},msg.type!=='bootstrap');return}if(msg.type==='profile_patch'){applyProfilePatch(msg.data||{});return}if(msg.type==='accounts_patch'){applyAccountsPatch(msg.data||{});return}if(msg.type==='account_patch'){applyAccountPatch(msg.data||{});return}if(msg.type==='invoice_patch'){applyInvoicePatch(msg.data||{});return}if(msg.type==='promo_patch'){applyPromoPatch(msg.data||{});return}if(msg.type==='tariffs_patch'){applyTariffsPatch(msg.data||{});return}if(msg.type==='addon_config_patch'){applyAddonConfigPatch(msg.data||{});return}}
function setTab(v){activeTab=(v||'profile');['profile','accounts','tariffs'].forEach(k=>{$('#view-'+k).style.display=(k===activeTab?'block':'none')});document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('a',t.dataset.v===activeTab));store.setTab(activeTab)}
async function setTariffType(v){tariffType=v==='addon'?'addon':'main';localStorage.setItem('zooma_app_tariff_type_v1',tariffType);if(tariffType==='addon')await loadAddonConfig();renderTariffsView()}
function toggleProxy(accountId){captureProxyDrafts();const aid=String(accountId||'');proxyOpen[aid]=!proxyOpen[aid];if(!proxyOpen[aid])delete proxyDrafts[aid];renderAccounts()}
async function connectPrompt(accountId){try{await api('/app/api/account/connect-prompt','POST',{account_id:accountId});toast('Дальнейшие действия в боте сообщениями','info',3500);setTimeout(()=>{try{tg.close()}catch(_){}},4000)}catch(e){toast(e.message||'Не удалось открыть авторизацию','err')}}
async function saveProxy(accountId){try{const aid=String(accountId||'');const draft=currentProxyDraft(aid)||{};let host=String(draft.host||'').trim(),port=parseInt(String(draft.port||'0').trim()||'0',10),login=String(draft.login||'').trim(),password=String(draft.password||'').trim();const full=String(draft.full||'').trim();if(full){const parsed=parseSocks5ProxyInput(full);host=parsed.host;port=parsed.port;login=parsed.login;password=parsed.password}if(!host||!port||!login||!password)throw new Error('Заполни SOCKS5 прокси: ip:port:login:password');await api('/app/api/proxy/manual','POST',{account_id:aid,host,port,login,password});proxyDrafts[aid]={full:'',host,port:String(port),login,password};toast('Прокси сохранён. Пинг обновится после проверки.','ok');if(!wsIsHealthy())setTimeout(()=>refreshState(true),700)}catch(e){toast(e.message||'Не удалось сохранить прокси','err',5000)}}
async function buyTariff(key){try{const j=await api('/app/api/tariff/invoice','POST',{tariff_key:key});state=state||{};state.pending_invoice=j.data||null;syncInvoiceFromState();renderTariffsView();setTab('tariffs');toast('Счёт создан','ok')}catch(e){toast(e.message||'Ошибка создания счёта','err',5000)}}
async function createAddonInvoice(){const btn=document.getElementById('addonConfirmBtn');try{const o=selectedAddonOption();if(!selectedAddonTariff||!o){toast('Выбери аккаунт','err');return}if(btn)btn.disabled=true;const j=await api('/app/api/addon/invoice','POST',{tariff_key:selectedAddonTariff.key,account_id:o.account_id});state=state||{};state.pending_invoice=j.data||null;syncInvoiceFromState();closeAddonModal();renderTariffsView();setTab('tariffs');toast('Счёт создан','ok');if(!wsIsHealthy())setTimeout(()=>refreshState(true),700)}catch(e){toast(e.message||'Ошибка создания счёта','err',5000)}finally{if(btn)btn.disabled=false}}
async function cancelInvoice(){try{const invId=String(lastInvoice?.invoice_id||'').trim();await api('/app/api/tariff/invoice/cancel','POST',{invoice_id:invId||null});state=state||{};state.pending_invoice=null;lastInvoice=null;store.clearInv();renderTariffsView();setTab('tariffs');toast('Оплата отменена','info');if(!wsIsHealthy())setTimeout(()=>refreshState(true),700)}catch(e){toast(e.message||'Не удалось отменить оплату','err',5000)}}
function openSupport(){const url='https://t.me/saxarok322';try{tg.openTelegramLink(url)}catch(_){try{window.location.href=url}catch(__){}}setTimeout(()=>{try{tg.close()}catch(_){}},120)}
function openPay(){if(!lastInvoice?.pay_url){toast('Ссылка оплаты не найдена','err');return}tg.openTelegramLink(lastInvoice.pay_url)}

function updateCountdownOnly(){const el=$('#invoiceCountdown');if(el&&lastInvoice?.expires_at_ts){const left=Number(lastInvoice.expires_at_ts||0)-Math.floor(Date.now()/1000);el.textContent=fmtCountdown(left);if(left<=0){lastInvoice=null;store.clearInv();if(state)state.pending_invoice=null;renderTariffsView()}}const a=activeChatAiAccount(),status=chatAiStatusText(a),aid=String(a?.account_id||'acc_1');const head=document.getElementById('chatAiHeaderStatus_'+aid),expanded=document.getElementById('chatAiExpandedStatus_'+aid);if(head)head.textContent=status;if(expanded)expanded.textContent=status}
function wsIsHealthy(){return !!(ws&&ws.readyState===WebSocket.OPEN&&(Date.now()-wsLastMessageTs)<20000)}
async function refreshState(force=false){if(stateRefreshBusy||document.hidden)return;if(!force&&wsIsHealthy())return;stateRefreshBusy=true;const hadInvoice=!!lastInvoice;try{const j=await api('/app/api/state');applySnapshotState(j.data,true);if(hadInvoice&&!lastInvoice)toast('Состояние оплаты обновлено','ok')}catch(_){}finally{stateRefreshBusy=false}}
function wsConnect(){if(wsReconnectTimer){clearTimeout(wsReconnectTimer);wsReconnectTimer=null}if(ws){try{ws.close()}catch(_){}ws=null}const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/app/ws?init_data=${encodeURIComponent(initData)}`);ws.onopen=()=>{wsLastMessageTs=Date.now();if(wsTimer)clearInterval(wsTimer);wsTimer=setInterval(()=>{try{if(ws&&ws.readyState===WebSocket.OPEN)ws.send('ping')}catch(_){}},15000)};ws.onmessage=(ev)=>{if(ev.data==='pong'){wsLastMessageTs=Date.now();return}try{const m=JSON.parse(ev.data);wsLastMessageTs=Date.now();applyWsPayload(m)}catch(_){}};ws.onclose=()=>{if(wsTimer){clearInterval(wsTimer);wsTimer=null}wsReconnectTimer=setTimeout(wsConnect,1200)};ws.onerror=()=>{try{ws&&ws.close()}catch(_){}}}

let chatAiFocusedCard=null,chatAiFocusTimer=null,chatAiViewportTimer=null;
function chatAiMobileViewport(){return window.matchMedia&&window.matchMedia('(max-width:759px)').matches&&(navigator.maxTouchPoints>0||'ontouchstart' in window)}
function updateChatAiKeyboardGap(){
  if(!chatAiMobileViewport())return;
  const vv=window.visualViewport;
  const keyboardGap=vv?Math.max(0,window.innerHeight-vv.height-vv.offsetTop):Math.round(window.innerHeight*.45);
  document.documentElement.style.setProperty('--chat-ai-keyboard-gap',`${Math.max(180,keyboardGap+28)}px`);
}
function alignChatAiCardToNavigation(){
  if(!chatAiMobileViewport()||!chatAiFocusedCard||!document.body.contains(chatAiFocusedCard))return;
  updateChatAiKeyboardGap();
  const tabsBottom=document.querySelector('.tabs')?.getBoundingClientRect().bottom||0;
  const rect=chatAiFocusedCard.getBoundingClientRect();
  const current=window.scrollY||document.documentElement.scrollTop||0;
  const target=Math.max(0,current+rect.top-tabsBottom-8);
  if(Math.abs(target-current)<2)return;
  window.scrollTo(0,target);
}
function scheduleChatAiCardAlignment(delay=0){
  if(chatAiFocusTimer)clearTimeout(chatAiFocusTimer);
  if(delay<=0){
    requestAnimationFrame(alignChatAiCardToNavigation);
    return;
  }
  chatAiFocusTimer=setTimeout(()=>requestAnimationFrame(alignChatAiCardToNavigation),delay);
}
document.addEventListener('focusin',e=>{
  const input=e.target?.closest?.('.chat-ai-box input:not([type="checkbox"]), .chat-ai-box textarea');
  if(!input||!chatAiMobileViewport())return;
  const card=input.closest('.chat-ai-box');
  if(chatAiFocusedCard&&chatAiFocusedCard!==card){
    chatAiFocusedCard.classList.remove('chat-ai-focus-card');
  }
  chatAiFocusedCard=card;
  chatAiFocusedCard.classList.add('chat-ai-focus-card');
  document.body.classList.add('chat-ai-keyboard-open');
  updateChatAiKeyboardGap();
  scheduleChatAiCardAlignment(0);
  scheduleChatAiCardAlignment(240);
});
document.addEventListener('focusout',e=>{
  if(!e.target?.closest?.('.chat-ai-box input:not([type="checkbox"]), .chat-ai-box textarea'))return;
  if(chatAiFocusTimer)clearTimeout(chatAiFocusTimer);
  chatAiFocusTimer=setTimeout(()=>{
    const active=document.activeElement?.closest?.('.chat-ai-box input:not([type="checkbox"]), .chat-ai-box textarea');
    if(active)return;
    if(chatAiFocusedCard){
      chatAiFocusedCard.classList.remove('chat-ai-focus-card');
    }
    chatAiFocusedCard=null;
    document.body.classList.remove('chat-ai-keyboard-open');
    document.documentElement.style.removeProperty('--chat-ai-keyboard-gap');
  },180);
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    if(!chatAiFocusedCard)return;
    updateChatAiKeyboardGap();
    if(chatAiViewportTimer)clearTimeout(chatAiViewportTimer);
    chatAiViewportTimer=setTimeout(alignChatAiCardToNavigation,90);
  });
}
(async()=>{try{const j=await api('/app/api/state');applySnapshotState(j.data,false);await syncTimezone();if(!state?.addon_config)await loadAddonConfig(true);if(!lastInvoice)hydrateSavedInvoice();renderAll();setTab(store.getTab());wsConnect()}catch(_){document.body.innerHTML='<div class="wrap"><div class="card">Откройте этот кабинет только через Telegram.</div></div>'}})();
const addonCancelBtn=document.getElementById('addonCancelBtn');if(addonCancelBtn)addonCancelBtn.onclick=closeAddonModal;
const addonConfirmBtn=document.getElementById('addonConfirmBtn');if(addonConfirmBtn)addonConfirmBtn.onclick=createAddonInvoice;
const addonBuyModal=document.getElementById('addonBuyModal');if(addonBuyModal)addonBuyModal.addEventListener('click',e=>{if(e.target===addonBuyModal)closeAddonModal()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.v));
if(countdownTimer)clearInterval(countdownTimer);
countdownTimer=setInterval(updateCountdownOnly,1000);
if(stateRefreshTimer)clearInterval(stateRefreshTimer);
stateRefreshTimer=setInterval(()=>refreshState(false),5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshState(true)});
